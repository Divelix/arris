[package]
name = "arris-io"
description = "Arris kernel: STEP AP214 and the native format"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["serde"]
# The native format: serde of the model, `postcard` for bytes and
# `serde_json` for diffs (docs/DATA-MODEL.md §Native format). Needs
# `arris-topo/serde`, which is on by default there.
serde = ["dep:serde", "dep:serde_json", "dep:postcard"]

[dependencies]
arris-check.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

# The sample bodies the writer is tried on and the oracle comparison live in
# `arris-debug`; a dev-dependency is exempt from the layer rule.
[dev-dependencies]
arris-debug.workspace = true

[lints]
workspace = true
