[package]
name = "arris-topo"
description = "Arris kernel: the model arena, typed ids, handles, orientation, entities and provenance"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["serde"]
# Derives on ids, handles and the model: the native format is serde of the
# model (docs/02-data-model.md §Native format).
serde = ["dep:serde", "arris-math/serde"]

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
