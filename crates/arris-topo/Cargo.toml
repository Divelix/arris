[package]
name = "arris-topo"
description = "Arris kernel: the model arena, typed ids, handles, orientation, entities and provenance"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["serde"]
# Derives on ids, handles and the model: the native format is serde of the
# model (docs/02-data-model.md §Native format).
serde = ["dep:serde", "arris-math/serde", "arris-geom/serde"]

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

# The seeded property-test runner lives in `arris-debug`; the dev-dependency
# cycle it makes is why the property tests are integration tests under
# `tests/` (docs/01-architecture.md §Formats and tools).
[dev-dependencies]
arris-debug.workspace = true
# `import` and `retain` prove their survivors with the checker, and so does
# every body `assemble` puts back together.
arris-check.workspace = true
# The two primitives are the bodies the corpus's `primitive/*` fixtures
# describe: `assemble` is run over them beside the samples.
arris-ops.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
