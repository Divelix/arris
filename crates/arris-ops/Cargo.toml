[package]
name = "arris-ops"
description = "Arris kernel: primitives, sweeps, transforms, booleans and mass properties"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The boolean's face-pair intersections and per-face splitting over
# rayon, both collected in the sequential order so a result is identical
# either way; never enabled on wasm32 (01 §Threading).
parallel = ["dep:rayon"]
# Run the checker after every operation in release builds too, returning
# `OpError::Internal` instead of a debug build's panic.
paranoid = []

[dependencies]
arris-check.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }

# The sample bodies, the dump and the oracle seam live in `arris-debug`,
# the STEP writer in `arris-io`; dev-dependencies are exempt from the
# layer rule.
[dev-dependencies]
arris-debug.workspace = true
arris-io.workspace = true
proptest.workspace = true

[lints]
workspace = true
