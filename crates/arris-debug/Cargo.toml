[package]
name = "arris-debug"
description = "Arris kernel: dev-facing text dump, PNG rasteriser, fixture loader and property-test strategies"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Reserved: stream shapes to a Rerun viewer for the human.
rerun = []

[dependencies]
arris-math.workspace = true
arris-topo.workspace = true
arris-ops.workspace = true
arris-mesh.workspace = true
arris-io.workspace = true
image.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Property tests never run on wasm, and proptest's random source does not
# build for wasm32-unknown-unknown; the `prop` module follows this cfg.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proptest.workspace = true

[lints]
workspace = true
