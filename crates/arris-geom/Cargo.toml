[package]
name = "arris-geom"
description = "Arris kernel: analytic and NURBS surfaces and curves, evaluation, projection, intersection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# Derives on the geometry enums and the NURBS types, each validated on the
# way in: the native format is serde of the model
# (docs/DATA-MODEL.md §Native format). `arris-topo/serde` turns this on.
serde = ["dep:serde", "arris-math/serde"]

[dependencies]
arris-math.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

# The dev-dependency cycle through `arris-debug` is why the property tests
# are integration tests under `tests/` (docs/ARCHITECTURE.md §Formats and
# tools).
[dev-dependencies]
# No version on the internal dev-dependencies below: a version would put
# them in the published manifest, and no publish order satisfies the cycle
# they make (the workspace manifest says why).
arris-debug.workspace = true
# The region integral is proven on the sample cylinder's faces, read
# through the topology crate; a dev-dependency is exempt from the layer rule.
arris-topo = { path = "../arris-topo" }
proptest.workspace = true

[lints]
workspace = true
