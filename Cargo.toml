# Virtual workspace manifest. The crates and their dependency edges are the
# table in docs/ARCHITECTURE.md §Crates; tools/check-layers.sh enforces
# that no crate depends on one above it.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates, referenced by path from the workspace so every edge is
# declared in exactly one place.
arris-math = { path = "crates/arris-math", version = "0.0.1" }
arris-geom = { path = "crates/arris-geom", version = "0.0.1" }
arris-topo = { path = "crates/arris-topo", version = "0.0.1" }
arris-check = { path = "crates/arris-check", version = "0.0.1" }
arris-ops = { path = "crates/arris-ops", version = "0.0.1" }
arris-mesh = { path = "crates/arris-mesh", version = "0.0.1" }
arris-io = { path = "crates/arris-io", version = "0.0.1" }
arris-debug = { path = "crates/arris-debug", version = "0.0.1" }

# External crates, pinned here and used with `workspace = true` (SEED.md §4).
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
robust = "1.2"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: a fixture's 17-digit coordinates must parse to the same f64
# the oracle read, or the recipe hash and the geometry comparison drift by an ulp.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# The native format's byte encoding (docs/DATA-MODEL.md §Native format):
# pure Rust, deterministic, builds for wasm32.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
proptest = { version = "1.11", default-features = false, features = ["std"] }
# PNG only: the rasteriser writes one format, and the default codec set
# pulls in dependencies that do not build for wasm32.
image = { version = "0.25", default-features = false, features = ["png"] }
# `arris-debug`'s `rerun` feature only, and never on wasm32 (01 §Threading).
# `sdk` alone (no viewer, no importers, no analytics) is the logging client.
rerun = { version = "0.37.1", default-features = false, features = ["sdk"] }
# `arris-mesh`'s `parallel` feature only, and never on wasm32 (01 §Threading).
rayon = "1.10"

# Every crate opts in with `[lints] workspace = true`
# (.agents/rules/kernel.md §API).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The dev profile — every `cargo test`, the pre-commit hook, the `inspect`
# tooling — runs with light optimisation and debug assertions on, so the
# checker still runs after every operation (`.agents/rules/kernel.md`) while
# the property tests over bodies whose (u, v) polygons hold tens of
# thousands of points finish: at `opt-level = 0` a boolean at a random pose
# took a second and its `Full` check up to forty (docs/plans/m4-booleans.md
# step 9); at 1 both are twenty to forty times faster. Debug info stays.
[profile.dev]
opt-level = 1
