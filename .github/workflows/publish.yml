# A release reaches crates.io from a tag, never from a laptop
# (.agents/rules/git.md §Tags): the human tags `vX.Y.Z` on a green `main`
# and pushes it, and this workflow publishes the workspace.
#
# `cargo publish --workspace` resolves the publish order itself and waits
# for each crate to appear in the index before the crate above it goes up,
# which is the whole reason the internal edges carry a version. It skips
# `arris-debug` (`publish = false`): dev-facing tooling, and the one crate
# a consumer never builds against.
#
# The token is a crates.io API token with publish rights, stored as the
# repository secret CARGO_REGISTRY_TOKEN. A scoped token that only covers
# the `arris*` crates is enough.
name: Publish

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The tag is the version, or the release is a mistake: a `v0.2.0` tag
      # over a workspace still at 0.1.0 would publish the old version under
      # the new name and there is no taking a version back off crates.io.
      - name: The tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --format-version 1 --no-deps | python3 -c \
            'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "arris"))')
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

      # The same gate `main` is held to (.agents/rules/git.md). CI proved it
      # on the commit; a tag can be pushed to any commit, so it is proved
      # again here before anything is uploaded. `cargo publish` runs its own
      # verifying build of each packaged crate on top of this.
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - run: tools/check-layers.sh

      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
