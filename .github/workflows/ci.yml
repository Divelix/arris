name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The roadmap's acceptance count for property tests is 1000 cases each
  # (docs/03-roadmap.md §M1); the pre-commit hook keeps the 256 default.
  # The STEP tests run the oracle's compare.py on Arris's output, so the
  # oracle environment is synced first (tools/oracle/README.md).
  test:
    runs-on: ubuntu-latest
    env:
      ARRIS_PROPTEST_CASES: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project tools/oracle
      - run: cargo test --workspace
      # arris-mesh's `parallel` feature (docs/plans/m3-tessellation.md
      # step 7): the same tests, so every sample body's and primitive's
      # mesh is byte-identical with faces triangulated in parallel.
      - run: cargo test -p arris-mesh --features parallel

  # A library's docs are part of its API: a broken intra-doc link or a
  # missing doc on a public item fails the build.
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  # The layer rule of docs/01-architecture.md §Crates: no crate depends on
  # one above it. The self-test proves the script still detects a violation.
  layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/check-layers.sh
      - run: tools/check-layers.sh --self-test

  # The Open CASCADE oracle agrees with itself: every op against closed
  # forms, committed expected.json values reproduced, OCCT's own STEP read
  # back clean (tools/oracle/README.md).
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project tools/oracle
      - run: uv run --project tools/oracle tools/oracle/selftest.py

  # Pure Rust, wasm-capable (SEED.md §4): the kernel builds for wasm with
  # its default features. A crate that grows a native-only dependency
  # breaks here first.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target wasm32-unknown-unknown

  # arris-debug's `rerun` feature pulls in the large `rerun` SDK crate
  # (docs/plans/m3-tessellation.md step 6, ⚠ OPEN resolved): kept out of
  # the hook and the `test` job so that feature's build time never slows
  # either, but still blocking here since a broken feature is a broken
  # crate.
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p arris-debug --features rerun
